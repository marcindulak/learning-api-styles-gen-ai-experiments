[behave]
; Feature files are tagged @status-todo, @status-active, or @status-done
; per the project's BDD workflow. Only todo features are excluded here,
; since active/done features are expected to have passing scenarios.
;
; @host-verified scenarios (see NFR-003.feature) test the app container's
; own lifecycle (stopping/restarting it) and so cannot run from inside a
; behave process this same command launches inside that container -- that
; process would be killed by the very "docker compose stop app" it is
; testing. Those scenarios are verified separately, by a script run
; directly on the host; see tests/single_unit_lifecycle.sh.
;
; ELN.md ENTRY 013 rejected a tag-exclusion rule for the structurally similar
; NFR-004 probe fixture, preferring directory placement outside features/ so
; a forgotten/changed tag couldn't silently reintroduce the scenario into the
; in-container run. That option isn't available here: unlike NFR-004's probe
; (pure test plumbing), NFR-003's host-verified scenario is a real acceptance
; scenario that must stay inside NFR-003.feature for REQUIREMENTS.md
; traceability, so this exclusion tag is the deliberate exception -- if this
; line is ever removed, the in-container run will "docker compose stop app"
; against its own container mid-suite.
tags = -status-todo
       -host-verified
